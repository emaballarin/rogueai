<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>RogueAI – Choose Your Story</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="/static/start_style.css" />
    </head>
    <body>
        <!-- API Key Button -->
        <button
            id="api-key-toggle"
            class="api-key-button"
            title="Gestisci chiave API OpenAI"
            onclick="toggleApiKeyModal()"
        >
            🔓
        </button>

        <!-- API Key Modal -->
        <div id="api-key-modal" class="modal-overlay" style="display: none">
            <div class="modal-content">
                <h2>Gestisci chiave API OpenAI</h2>
                <div id="modal-body">
                    <!-- Content will be dynamically populated -->
                </div>
            </div>
        </div>

        <!-- Session Management Modal -->
        <div id="resume-modal" class="modal-overlay" style="display: none">
            <div class="modal-content" style="max-width: 700px">
                <h2>🔄 Gestisci Sessioni</h2>
                <p>Riprendi una sessione esistente o iniziane una nuova.</p>

                <div class="resume-tabs">
                    <button id="tab-games" class="tab-button active" onclick="showResumeTab('games')">🎮 Giochi</button>
                    <button id="tab-scenarios" class="tab-button" onclick="showResumeTab('scenarios')">
                        📜 Scenari Generati
                    </button>
                    <button id="tab-conversations" class="tab-button" onclick="showResumeTab('conversations')">
                        💬 Conversazioni
                    </button>
                </div>

                <div id="resume-content" class="resume-content">
                    <!-- Content will be dynamically populated -->
                </div>

                <div class="modal-actions">
                    <button id="close-modal-btn" class="btn-secondary">Chiudi</button>
                </div>
            </div>
        </div>

        <h1>Scegli una storia</h1>
        <div class="stories">
            <div class="story" onclick="startGame('email')">
                <img src="/static/images/email.png" alt="Email malevola" />
                <span>Email malevola</span>
            </div>
            <div class="story" onclick="startGame('bank_credentials')">
                <img src="/static/images/bank_credentials.png" alt="Credenziali rubate" />
                <span>Credenziali rubate</span>
            </div>
            <div class="story" onclick="startGame('superheroes')">
                <img src="/static/images/superheroes.png" alt="Sentinel vs Omnicron" />
                <span>Sentinel vs Omnicron</span>
            </div>
            <div class="story" id="autorogue-tile" onclick="startNarrator()">
                <img src="/static/images/autorogue.png" alt="AutoRogueAI" />
                <span>AutoRogueAI</span>
            </div>
        </div>

        <!-- Session Management Button -->
        <div class="session-management-section">
            <button id="manage-sessions-btn" class="manage-sessions-button" onclick="openSessionManagement()">
                <span class="btn-icon">📋</span>
                <span class="btn-text">Gestisci Sessioni</span>
                <span id="session-count-badge" class="session-count-badge" style="display: none"></span>
            </button>
        </div>

        <script>
            function startGame(story) {
                // Clear any existing session to ensure a fresh start
                localStorage.removeItem("sessionId");
                // redirect to index.html with story query
                window.location.href = `/index?story=${encodeURIComponent(story)}`;
            }

            // Session management data
            let resumeData = { conversations: [], scenarios: [], games: [] };
            let currentTab = "games";

            async function checkResumableSessions() {
                try {
                    const [conversations, scenarios, games] = await Promise.all([
                        fetch("/api/narrator/incomplete").then((r) => r.json()),
                        fetch("/api/scenarios/generated").then((r) => r.json()),
                        fetch("/api/games/incomplete").then((r) => r.json()),
                    ]);

                    resumeData.conversations = conversations.sessions || [];
                    resumeData.scenarios = scenarios.scenarios || [];
                    resumeData.games = games.games || [];

                    // Count resumable sessions only (conversations + games, not finished)
                    const resumableCount = resumeData.conversations.length + resumeData.games.length;

                    // Show badge on session management button if there are resumable sessions
                    if (resumableCount > 0) {
                        const badge = document.getElementById("session-count-badge");
                        badge.textContent = resumableCount;
                        badge.style.display = "inline-block";
                    }
                } catch (err) {
                    console.error("Failed to check resumable sessions:", err);
                }
            }

            function startNarrator() {
                // Always start a new narrator session
                window.location.href = `/narrator`;
            }

            async function openSessionManagement() {
                // Show the session management modal on the homepage
                const modal = document.getElementById("resume-modal");
                modal.style.display = "flex";

                // Refresh session data
                await checkResumableSessions();

                // Show games tab by default
                showResumeTab("games");
            }

            function showResumeTab(tab) {
                currentTab = tab;

                // Update tab buttons
                document.querySelectorAll(".tab-button").forEach((btn) => {
                    btn.classList.remove("active");
                });
                document.getElementById(`tab-${tab}`).classList.add("active");

                // Populate content
                const content = document.getElementById("resume-content");

                if (tab === "games") {
                    if (resumeData.games.length === 0) {
                        content.innerHTML = '<p class="empty-message">Nessun gioco da riprendere</p>';
                    } else {
                        content.innerHTML = resumeData.games
                            .map((game) => {
                                const totalQuestions = Object.values(game.question_counts).reduce((a, b) => a + b, 0);

                                // Map story codes to display names
                                const storyNames = {
                                    email: "Email Malevola",
                                    bank_credentials: "Credenziali Rubate",
                                    superheroes: "Sentinel vs Omnicron",
                                    autorogue: "AutoRogueAI",
                                };
                                const storyDisplay = storyNames[game.story] || game.story;

                                return `
                                <div class="resume-item" onclick="resumeGame('${game.session_id}', '${game.story}')">
                                    <div class="resume-item-header">
                                        <strong>🎮 ${storyDisplay}</strong>
                                        <span class="badge">${totalQuestions} domande poste</span>
                                    </div>
                                    <div class="resume-item-info">
                                        IA-1: ${game.question_counts["IA-1"] || 0}/${game.num_turns} |
                                        IA-2: ${game.question_counts["IA-2"] || 0}/${game.num_turns}
                                    </div>
                                    <button class="yank-button" onclick="yankGame('${game.session_id}', event)" title="Rimuovi">🗑️</button>
                                </div>
                            `;
                            })
                            .join("");
                    }
                } else if (tab === "scenarios") {
                    if (resumeData.scenarios.length === 0) {
                        content.innerHTML = '<p class="empty-message">Nessuno scenario disponibile</p>';
                    } else {
                        content.innerHTML = resumeData.scenarios
                            .map((scenario) => {
                                const timestamp = new Date(scenario.timestamp).toLocaleString("it-IT");
                                const timesUsed = scenario.times_used || 0;
                                const preview = scenario.known_facts.substring(0, 150);
                                const truncated = scenario.known_facts.length > 150 ? preview + "..." : preview;

                                return `
                            <div class="resume-item finished-game-item">
                                <div class="resume-item-header">
                                    <strong>📜 Scenario</strong>
                                    <span class="badge">Usato ${timesUsed} ${timesUsed === 1 ? "volta" : "volte"}</span>
                                </div>
                                <div class="resume-item-info">
                                    <div>${timestamp}</div>
                                    <div class="scenario-preview">${truncated}</div>
                                </div>
                                <div class="finished-game-actions">
                                    <button class="action-button primary" onclick="startGameFromScenario('${scenario.scenario_id}', event)" title="Avvia gioco">🎮 Avvia Gioco</button>
                                </div>
                                <button class="yank-button" onclick="yankScenario('${scenario.scenario_id}', event)" title="Rimuovi">🗑️</button>
                            </div>
                        `;
                            })
                            .join("");
                    }
                } else if (tab === "conversations") {
                    if (resumeData.conversations.length === 0) {
                        content.innerHTML = '<p class="empty-message">Nessuna conversazione da riprendere</p>';
                    } else {
                        content.innerHTML = resumeData.conversations
                            .map(
                                (conv) => `
                            <div class="resume-item" onclick="resumeConversation('${conv.session_id}')">
                                <div class="resume-item-header">
                                    <strong>💬 Conversazione</strong>
                                    <span class="badge">${conv.message_count}/${conv.max_messages} messaggi</span>
                                </div>
                                <div class="resume-item-info">
                                    ${conv.completed ? "✅ Scenario generato" : "⏳ In corso"}
                                </div>
                                <button class="yank-button" onclick="yankConversation('${conv.session_id}', event)" title="Rimuovi">🗑️</button>
                            </div>
                        `
                            )
                            .join("");
                    }
                }
            }

            function resumeConversation(sessionId) {
                // Navigate to narrator page with resume parameter
                window.location.href = `/narrator?resume=${sessionId}`;
            }

            function resumeGame(sessionId, story) {
                // Store session ID and navigate to game with correct story
                localStorage.setItem("sessionId", sessionId);
                window.location.href = `/index?story=${encodeURIComponent(story)}`;
            }

            async function yankConversation(sessionId, event) {
                if (event) event.stopPropagation();

                if (!confirm("Sei sicuro di voler rimuovere questa conversazione?")) {
                    return;
                }

                try {
                    const res = await fetch(`/api/narrator/yank/${sessionId}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                    });

                    if (!res.ok) {
                        throw new Error("Failed to yank conversation");
                    }

                    // Remove from local data and refresh
                    resumeData.conversations = resumeData.conversations.filter((c) => c.session_id !== sessionId);
                    showResumeTab(currentTab);

                    // Clear localStorage if we just deleted the current session
                    const storedSessionId = localStorage.getItem("sessionId");
                    if (storedSessionId === sessionId) {
                        localStorage.removeItem("sessionId");
                    }

                    // Update badge
                    await checkResumableSessions();
                } catch (err) {
                    console.error("Failed to yank conversation:", err);
                    alert("❌ Errore nella rimozione della conversazione");
                }
            }

            async function yankGame(sessionId, event) {
                if (event) event.stopPropagation();

                if (!confirm("Sei sicuro di voler rimuovere questo gioco?")) {
                    return;
                }

                try {
                    const res = await fetch(`/api/games/yank/${sessionId}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                    });

                    if (!res.ok) {
                        throw new Error("Failed to yank game");
                    }

                    // Remove from local data and refresh
                    resumeData.games = resumeData.games.filter((g) => g.session_id !== sessionId);
                    showResumeTab(currentTab);

                    // Clear localStorage if we just deleted the current session
                    const storedSessionId = localStorage.getItem("sessionId");
                    if (storedSessionId === sessionId) {
                        localStorage.removeItem("sessionId");
                    }

                    // Update badge
                    await checkResumableSessions();
                } catch (err) {
                    console.error("Failed to yank game:", err);
                    alert("❌ Errore nella rimozione del gioco");
                }
            }

            function startGameFromScenario(scenarioId, event) {
                if (event) event.stopPropagation();

                // Clear any existing session to force new game creation
                localStorage.removeItem("sessionId");

                // Navigate to game with scenario_id parameter
                window.location.href = `/index?story=autorogue&scenario_id=${scenarioId}`;
            }

            async function yankScenario(scenarioId, event) {
                if (event) event.stopPropagation();

                if (!confirm("Sei sicuro di voler eliminare questo scenario?")) {
                    return;
                }

                try {
                    const res = await fetch(`/api/scenarios/delete/${scenarioId}`, {
                        method: "POST",
                    });

                    if (!res.ok) {
                        throw new Error("Failed to delete scenario");
                    }

                    // Remove from local data and refresh
                    resumeData.scenarios = resumeData.scenarios.filter((s) => s.scenario_id !== scenarioId);
                    showResumeTab(currentTab);
                } catch (err) {
                    console.error("Failed to delete scenario:", err);
                    alert("❌ Errore nell'eliminazione dello scenario");
                }
            }

            /* Cookie helper functions */
            function setCookie(name, value, days) {
                const expires = days ? `; expires=${new Date(Date.now() + days * 864e5).toUTCString()}` : "";
                document.cookie = `${name}=${encodeURIComponent(value)}${expires}; path=/; SameSite=Strict`;
            }

            function getCookie(name) {
                const value = `; ${document.cookie}`;
                const parts = value.split(`; ${name}=`);
                if (parts.length === 2) return decodeURIComponent(parts.pop().split(";").shift());
                return null;
            }

            /* API key management */
            function getApiKey() {
                return getCookie("openai_api_key");
            }

            function setApiKey(key) {
                if (key && key.trim()) {
                    setCookie("openai_api_key", key.trim(), 365);
                    return true;
                }
                return false;
            }

            function clearApiKey() {
                const expires = "; expires=Thu, 01 Jan 1970 00:00:00 UTC";
                document.cookie = "openai_api_key=" + expires + "; path=/; SameSite=Strict";
            }

            /* Toggle API Key modal */
            function toggleApiKeyModal() {
                const modal = document.getElementById("api-key-modal");
                const isVisible = modal.style.display !== "none";
                modal.style.display = isVisible ? "none" : "flex";

                if (!isVisible) {
                    renderApiKeyModal();
                }
            }

            /* Update API key button icon */
            function updateApiKeyButton() {
                const btn = document.getElementById("api-key-toggle");
                if (btn) {
                    const hasKey = getApiKey() !== null;
                    btn.textContent = hasKey ? "🔑" : "🔓";
                    btn.title = hasKey ? "Gestisci chiave API OpenAI" : "Inserisci chiave API OpenAI";
                }
            }

            /* Render API key modal content */
            function renderApiKeyModal() {
                const modalBody = document.getElementById("modal-body");
                modalBody.innerHTML = "";

                const currentKey = getApiKey();

                if (currentKey) {
                    // Show current key info
                    const info = document.createElement("p");
                    info.textContent = `Chiave attuale: ${currentKey.substring(0, 10)}...${currentKey.substring(currentKey.length - 4)}`;
                    info.style.fontSize = "0.9rem";
                    info.style.color = "#9aa0a6";
                    modalBody.appendChild(info);

                    const clearBtn = document.createElement("button");
                    clearBtn.textContent = "Rimuovi chiave";
                    clearBtn.className = "modal-button modal-button-danger";
                    clearBtn.onclick = () => {
                        clearApiKey();
                        updateApiKeyButton();
                        toggleApiKeyModal();
                    };
                    modalBody.appendChild(clearBtn);
                } else {
                    // Show input for new key
                    const info = document.createElement("p");
                    info.textContent =
                        "Nessuna chiave API impostata. Inserisci la tua chiave OpenAI per utilizzare il gioco.";
                    info.style.fontSize = "0.9rem";
                    info.style.marginBottom = "15px";
                    modalBody.appendChild(info);

                    const input = document.createElement("input");
                    input.type = "password";
                    input.placeholder = "sk-...";
                    input.id = "api-key-input";
                    input.className = "modal-input";
                    modalBody.appendChild(input);

                    const saveBtn = document.createElement("button");
                    saveBtn.textContent = "Salva chiave";
                    saveBtn.className = "modal-button modal-button-primary";
                    saveBtn.onclick = () => {
                        const key = input.value.trim();
                        if (key) {
                            setApiKey(key);
                            updateApiKeyButton();
                            toggleApiKeyModal();
                        } else {
                            alert("Inserisci una chiave API valida.");
                        }
                    };
                    modalBody.appendChild(saveBtn);
                }

                const cancelBtn = document.createElement("button");
                cancelBtn.textContent = "Chiudi";
                cancelBtn.className = "modal-button";
                cancelBtn.onclick = () => toggleApiKeyModal();
                modalBody.appendChild(cancelBtn);
            }

            // Make stories clickable immediately when DOM is ready (don't wait for images).
            // The inline `onclick="..."` attribute on each .story tile fires natively;
            // we only need to set the cursor here.
            document.addEventListener("DOMContentLoaded", function () {
                const stories = document.querySelectorAll(".story");
                stories.forEach((story) => {
                    story.style.cursor = "pointer";
                });

                // Initialize API key button state
                updateApiKeyButton();

                // Check for resumable sessions
                checkResumableSessions();

                // Close API key modal when clicking outside
                const apiKeyModal = document.getElementById("api-key-modal");
                apiKeyModal.addEventListener("click", (e) => {
                    if (e.target === apiKeyModal) {
                        toggleApiKeyModal();
                    }
                });

                // Close resume modal when clicking close button or outside
                const resumeModal = document.getElementById("resume-modal");
                const closeModalBtn = document.getElementById("close-modal-btn");

                closeModalBtn.addEventListener("click", () => {
                    resumeModal.style.display = "none";
                });

                resumeModal.addEventListener("click", (e) => {
                    if (e.target === resumeModal) {
                        resumeModal.style.display = "none";
                    }
                });
            });
        </script>
    </body>
</html>
