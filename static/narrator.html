<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>RogueAI - Story Generator</title>
        <link rel="stylesheet" href="/static/narrator_style.css" />
        <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    </head>

    <body>
        <div id="app">
            <div class="narrator-container">
                <!-- Header -->
                <div class="header">
                    <h1>🎭 AI Narrator - Story Generator</h1>
                    <div class="message-counter"><span id="message-count">0/5</span> messaggi utilizzati</div>
                </div>

                <!-- Chat Area -->
                <div class="chat-container">
                    <div id="chat-messages" class="chat-messages">
                        <!-- Messages will be dynamically added here -->
                    </div>
                </div>

                <!-- Input Area -->
                <div class="input-container">
                    <textarea
                        id="user-input"
                        placeholder="Caricamento in corso..."
                        rows="3"
                        maxlength="1000"
                        disabled
                    ></textarea>
                    <button id="send-btn" class="btn-send" disabled>Invia</button>
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button id="back-btn" class="btn-secondary">🔙 Torna Indietro / Reset</button>
                    <button id="generate-btn" class="btn-primary">✨ Genera Scenario</button>
                    <button id="send-generate-btn" class="btn-primary" disabled style="display: none">
                        📤 Invia e Genera
                    </button>
                </div>

                <!-- Generated Scenarios List -->
                <div id="scenarios-list" class="scenarios-list" style="display: none">
                    <h2>📜 Scenari Generati</h2>
                    <p class="scenarios-hint">
                        Hai generato i seguenti scenari. Puoi avviare un gioco da qualsiasi scenario, e ogni scenario
                        può essere riutilizzato più volte.
                    </p>
                    <div id="scenarios-container" class="scenarios-container">
                        <!-- Scenarios will be dynamically added here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- TTS Toggle Button -->
        <button id="tts-toggle" class="tts-toggle-button" title="Toggle TTS">🔊</button>

        <!-- API Key Button -->
        <button id="api-key-toggle" class="api-key-button" title="Gestisci chiave API OpenAI">🔓</button>

        <!-- API Key Modal -->
        <div id="api-key-modal" class="modal-overlay" style="display: none">
            <div class="modal-content">
                <h2>Gestisci chiave API OpenAI</h2>
                <div id="modal-body">
                    <!-- Content will be dynamically populated -->
                </div>
            </div>
        </div>

        <!-- Session ID footer (see index.html) -->
        <div id="session-footer" class="session-footer" aria-live="polite">
            <span class="session-footer-label">Sessione:</span>
            <code id="session-footer-id">—</code>
            <button id="session-footer-copy" type="button" title="Copia ID sessione">📋</button>
        </div>

        <script src="/static/narrator.js"></script>
    </body>
</html>
