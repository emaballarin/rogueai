<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RogueAI – Authentication</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: 'Courier New', monospace;
      background: linear-gradient(135deg, #0f0f23 0%, #1e1e3e 100%);
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .auth-container {
      background: rgba(40, 40, 60, 0.8);
      border: 2px solid #666;
      border-radius: 12px;
      padding: 40px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 20px rgba(100, 149, 237, 0.3);
    }

    h1 {
      color: #6495ed;
      margin-bottom: 30px;
      font-size: 24px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #666;
      border-radius: 6px;
      background: rgba(20, 20, 40, 0.8);
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      box-sizing: border-box;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: #6495ed;
      box-shadow: 0 0 10px rgba(100, 149, 237, 0.3);
    }

    .auth-button {
      width: 100%;
      padding: 12px;
      background: #6495ed;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      transition: background 0.3s;
    }

    .auth-button:hover:not(:disabled) {
      background: #4169e1;
    }

    .auth-button:disabled {
      background: #666;
      cursor: not-allowed;
    }

    .error-message {
      color: #ff6b6b;
      margin-top: 15px;
      font-size: 14px;
    }

    .loading {
      color: #6495ed;
      margin-top: 15px;
      font-size: 14px;
    }

    .retry-info {
      color: #ffa500;
      margin-top: 10px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <h1>🔐 Access Required</h1>
    <div class="input-group">
      <input
        type="password"
        id="passwordInput"
        placeholder="Enter password..."
        autocomplete="off"
      />
    </div>
    <button class="auth-button" id="authButton" onclick="authenticate()">
      Authenticate
    </button>
    <div id="errorMessage" class="error-message"></div>
    <div id="loadingMessage" class="loading"></div>
    <div id="retryInfo" class="retry-info"></div>
  </div>

  <script>
    let attempts = 0;
    let nextAttemptTime = 0;
    let countdownInterval = null;

    function showError(message) {
      document.getElementById('errorMessage').textContent = message;
      document.getElementById('loadingMessage').textContent = '';
    }

    function showLoading(message) {
      document.getElementById('loadingMessage').textContent = message;
      document.getElementById('errorMessage').textContent = '';
    }

    function clearMessages() {
      document.getElementById('errorMessage').textContent = '';
      document.getElementById('loadingMessage').textContent = '';
      document.getElementById('retryInfo').textContent = '';
    }

    function updateCountdown() {
      const now = Date.now();
      const remaining = Math.ceil((nextAttemptTime - now) / 1000);

      if (remaining <= 0) {
        clearInterval(countdownInterval);
        countdownInterval = null;
        document.getElementById('authButton').disabled = false;
        document.getElementById('retryInfo').textContent = '';
        return;
      }

      document.getElementById('retryInfo').textContent = `Next attempt in ${remaining}s`;
    }

    function startCountdown(delayMs) {
      nextAttemptTime = Date.now() + delayMs;
      document.getElementById('authButton').disabled = true;

      if (countdownInterval) {
        clearInterval(countdownInterval);
      }

      countdownInterval = setInterval(updateCountdown, 1000);
      updateCountdown();
    }

    async function sha512(str) {
      const buf = await crypto.subtle.digest("SHA-512", new TextEncoder().encode(str));
      return Array.prototype.map.call(new Uint8Array(buf), x => ('00' + x.toString(16)).slice(-2)).join('');
    }

    async function authenticate() {
      const password = document.getElementById('passwordInput').value;

      if (!password) {
        showError('Please enter a password');
        return;
      }

      if (Date.now() < nextAttemptTime) {
        return;
      }

      clearMessages();
      showLoading('Authenticating...');

      try {
        const hashedPassword = await sha512(password);

        const response = await fetch('/.auth/sha512');
        if (!response.ok) {
          throw new Error('Failed to load authentication data');
        }

        const expectedHash = (await response.text()).trim();

        if (hashedPassword === expectedHash) {
          showLoading('Authentication successful! Redirecting...');
          localStorage.setItem('rogueai_authenticated', 'true');
          localStorage.setItem('rogueai_auth_time', Date.now().toString());

          // Set cookie for server-side authentication
          document.cookie = 'rogueai_authenticated=true; path=/; max-age=259200'; // 3 days (~TSNext)

          setTimeout(() => {
            window.location.href = '/';
          }, 1000);
          return;
        }

        attempts++;
        showError(`Incorrect password (${attempts} attempt${attempts === 1 ? '' : 's'})`);

        if (attempts > 3) {
          const delayMs = Math.pow(2, attempts - 4) * 2000;
          startCountdown(delayMs);
        }

        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();

      } catch (error) {
        showError('Authentication failed. Please try again.');
        console.error('Auth error:', error);
      }
    }

    document.getElementById('passwordInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        authenticate();
      }
    });

    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
    }

    window.onload = function() {
      if (localStorage.getItem('rogueai_authenticated') === 'true' || getCookie('rogueai_authenticated') === 'true') {
        window.location.href = '/';
        return;
      }
      document.getElementById('passwordInput').focus();
    };
  </script>
</body>
</html>
