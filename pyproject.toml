[project]
name = "rogueai"
version = "0.1.0"
description = "RogueAI WebApp"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.12",
    "numpy>=2.2.5",
    "openai>=1.77",
    "pydantic>=2.11.4",
    "torch>=2.7",
    "uvicorn[standard]>=0.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
